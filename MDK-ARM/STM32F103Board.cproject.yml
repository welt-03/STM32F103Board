project:
  packs:
    - pack: ARM::CMSIS@^6.1.0
    - pack: Keil::STM32F1xx_DFP@^2.4.1
    - pack: ARM::CMSIS-NN@^4.0.0
    - pack: ARM::CMSIS-DSP@^1.10.1
  setups:
    - setup: Options for STM32F103Board
      add-path:
        - ../Core/Inc
        - ../Drivers/STM32F1xx_HAL_Driver/Inc
        - ../Drivers/STM32F1xx_HAL_Driver/Inc/Legacy
        - ../Drivers/CMSIS/Device/ST/STM32F1xx/Include
        - ../Drivers/CMSIS/Include
        - ../Code/Inc
        - ../Ui/hal/u8g2
        - ../Ui/hal
      debug: "on"
      define:
        - USE_HAL_DRIVER
        - STM32F103xB
      misc:
        - C:
            - -std=c99
          C-CPP:
            - -fno-rtti
            - -funsigned-char
            - -fshort-enums
            - -fshort-wchar
            - -ffunction-sections
            - -Wno-packed
            - -Wno-missing-variable-declarations
            - -Wno-missing-prototypes
            - -Wno-missing-noreturn
            - -Wno-sign-conversion
            - -Wno-nonportable-include-path
            - -Wno-reserved-id-macro
            - -Wno-unused-macros
            - -Wno-documentation-unknown-command
            - -Wno-documentation
            - -Wno-license-management
            - -Wno-parentheses-equality
          CPP:
            - -xc++
            - -std=c++11
            - -fno-exceptions
          ASM:
            - -masm=auto
          Link:
            - --map
            - --load_addr_map_info
            - --xref
            - --callgraph
            - --symbols
            - --info sizes
            - --info totals
            - --info unused
            - --info veneers
            - --strict
            - --summary_stderr
            - --info summarysizes
  linker:
    - script: STM32F103Board_STM32F103Board.sct
  groups:
    - group: Application/MDK-ARM
      files:
        - file: startup_stm32f103xb.s
    - group: Application/User/Core
      files:
        - file: ../Core/Src/main.c
        - file: ../Core/Src/gpio.c
        - file: ../Core/Src/dma.c
        - file: ../Core/Src/i2c.c
          misc:
            - CPP:
                - -xc++
        - file: ../Core/Src/spi.c
        - file: ../Core/Src/tim.c
        - file: ../Core/Src/usart.c
        - file: ../Core/Src/stm32f1xx_it.c
        - file: ../Core/Src/stm32f1xx_hal_msp.c
        - file: ../Core/Src/stm32f1xx_hal_timebase_tim.c
    - group: Drivers/STM32F1xx_HAL_Driver
      files:
        - file: ../Drivers/STM32F1xx_HAL_Driver/Src/stm32f1xx_hal_gpio_ex.c
        - file: ../Drivers/STM32F1xx_HAL_Driver/Src/stm32f1xx_hal_tim.c
        - file: ../Drivers/STM32F1xx_HAL_Driver/Src/stm32f1xx_hal_tim_ex.c
        - file: ../Drivers/STM32F1xx_HAL_Driver/Src/stm32f1xx_hal_i2c.c
          misc:
            - CPP:
                - -xc++
        - file: ../Drivers/STM32F1xx_HAL_Driver/Src/stm32f1xx_hal.c
        - file: ../Drivers/STM32F1xx_HAL_Driver/Src/stm32f1xx_hal_rcc.c
        - file: ../Drivers/STM32F1xx_HAL_Driver/Src/stm32f1xx_hal_rcc_ex.c
        - file: ../Drivers/STM32F1xx_HAL_Driver/Src/stm32f1xx_hal_gpio.c
        - file: ../Drivers/STM32F1xx_HAL_Driver/Src/stm32f1xx_hal_dma.c
        - file: ../Drivers/STM32F1xx_HAL_Driver/Src/stm32f1xx_hal_cortex.c
        - file: ../Drivers/STM32F1xx_HAL_Driver/Src/stm32f1xx_hal_pwr.c
        - file: ../Drivers/STM32F1xx_HAL_Driver/Src/stm32f1xx_hal_flash.c
        - file: ../Drivers/STM32F1xx_HAL_Driver/Src/stm32f1xx_hal_flash_ex.c
        - file: ../Drivers/STM32F1xx_HAL_Driver/Src/stm32f1xx_hal_exti.c
        - file: ../Drivers/STM32F1xx_HAL_Driver/Src/stm32f1xx_hal_spi.c
        - file: ../Drivers/STM32F1xx_HAL_Driver/Src/stm32f1xx_hal_uart.c
    - group: Drivers/CMSIS
      files:
        - file: ../Core/Src/system_stm32f1xx.c
    - group: Application/User/Code
      files:
        - file: ../Code/Src/sys.c
        - file: ../Code/Src/retarget.c
        - file: ../Code/Src/stream.cpp
        - file: ../Code/Src/task.cpp
    - group: Ui/hal/u8g2
      files:
        - file: ../Ui/hal/stm32_u8g2.c
        - file: ../Ui/hal/u8g2/mui.c
        - file: ../Ui/hal/u8g2/mui_u8g2.c
        - file: ../Ui/hal/u8g2/u8g2_arc.c
        - file: ../Ui/hal/u8g2/u8g2_bitmap.c
        - file: ../Ui/hal/u8g2/u8g2_box.c
        - file: ../Ui/hal/u8g2/u8g2_buffer.c
        - file: ../Ui/hal/u8g2/u8g2_button.c
        - file: ../Ui/hal/u8g2/u8g2_circle.c
        - file: ../Ui/hal/u8g2/u8g2_cleardisplay.c
        - file: ../Ui/hal/u8g2/u8g2_d_memory.c
        - file: ../Ui/hal/u8g2/u8g2_d_setup.c
        - file: ../Ui/hal/u8g2/u8g2_font.c
        - file: ../Ui/hal/u8g2/u8g2_fonts.c
        - file: ../Ui/hal/u8g2/u8g2_hvline.c
        - file: ../Ui/hal/u8g2/u8g2_input_value.c
        - file: ../Ui/hal/u8g2/u8g2_intersection.c
        - file: ../Ui/hal/u8g2/u8g2_kerning.c
        - file: ../Ui/hal/u8g2/u8g2_line.c
        - file: ../Ui/hal/u8g2/u8g2_ll_hvline.c
        - file: ../Ui/hal/u8g2/u8g2_message.c
        - file: ../Ui/hal/u8g2/u8g2_polygon.c
        - file: ../Ui/hal/u8g2/u8g2_selection_list.c
        - file: ../Ui/hal/u8g2/u8g2_setup.c
        - file: ../Ui/hal/u8g2/u8log.c
        - file: ../Ui/hal/u8g2/u8log_u8g2.c
        - file: ../Ui/hal/u8g2/u8log_u8x8.c
        - file: ../Ui/hal/u8g2/u8x8_8x8.c
        - file: ../Ui/hal/u8g2/u8x8_byte.c
        - file: ../Ui/hal/u8g2/u8x8_cad.c
        - file: ../Ui/hal/u8g2/u8x8_capture.c
        - file: ../Ui/hal/u8g2/u8x8_d_ssd1306_128x64_noname.c
        - file: ../Ui/hal/u8g2/u8x8_d_stdio.c
        - file: ../Ui/hal/u8g2/u8x8_debounce.c
        - file: ../Ui/hal/u8g2/u8x8_display.c
        - file: ../Ui/hal/u8g2/u8x8_fonts.c
        - file: ../Ui/hal/u8g2/u8x8_gpio.c
        - file: ../Ui/hal/u8g2/u8x8_input_value.c
        - file: ../Ui/hal/u8g2/u8x8_message.c
        - file: ../Ui/hal/u8g2/u8x8_selection_list.c
        - file: ../Ui/hal/u8g2/u8x8_setup.c
        - file: ../Ui/hal/u8g2/u8x8_string.c
        - file: ../Ui/hal/u8g2/u8x8_u8toa.c
        - file: ../Ui/hal/u8g2/u8x8_u16toa.c
  components:
    - component: ARM::CMSIS:CORE
